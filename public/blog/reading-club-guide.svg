<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-label="독서동호회 구조: 고정된 자리, 역할 4개로 쪼개기, 결석해도 자리 유지, 4명으로 시작하는 6주 설계">
  <rect width="880" height="400" rx="20" fill="#f5f8fb"/>
  <text x="440" y="44" text-anchor="middle" fill="#1a2332" font-family="sans-serif" font-size="22" font-weight="800">오래 가는 독서동호회의 4가지 구조</text>
  <text x="440" y="72" text-anchor="middle" fill="#568a35" font-family="sans-serif" font-size="14" font-weight="700">사람이 좋아서 읽히는 게 아니라, 빠져도 다음 자리가 남아서 읽힌다</text>

  <g>
    <rect x="34" y="100" width="192" height="196" rx="14" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="130" cy="140" r="21" fill="#3f7cb3"/>
    <text x="130" y="148" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="17" font-weight="800">1</text>
    <text x="130" y="184" text-anchor="middle" fill="#1a2332" font-family="sans-serif" font-size="15" font-weight="800">고정된 자리</text>
    <text x="130" y="206" text-anchor="middle" fill="#5b6b82" font-family="sans-serif" font-size="11.5">읽을 시간을 매번 안 정한다</text>
    <line x1="66" y1="224" x2="194" y2="224" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="130" y="248" text-anchor="middle" fill="#568a35" font-family="sans-serif" font-size="11.5" font-weight="700">같은 요일 · 같은 시각 90분</text>
    <text x="130" y="270" text-anchor="middle" fill="#1a2332" font-family="sans-serif" font-size="12">동기부여가 아니라 마감</text>
  </g>

  <g>
    <rect x="240" y="100" width="192" height="196" rx="14" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="336" cy="140" r="21" fill="#7a6ca8"/>
    <text x="336" y="148" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="17" font-weight="800">2</text>
    <text x="336" y="184" text-anchor="middle" fill="#1a2332" font-family="sans-serif" font-size="15" font-weight="800">역할 쪼개기</text>
    <text x="336" y="206" text-anchor="middle" fill="#5b6b82" font-family="sans-serif" font-size="11.5">진행자 1인 과부하가 1순위 사인</text>
    <line x1="272" y1="224" x2="400" y2="224" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="336" y="248" text-anchor="middle" fill="#568a35" font-family="sans-serif" font-size="11.5" font-weight="700">발제 · 공지 · 장소 · 기록</text>
    <text x="336" y="270" text-anchor="middle" fill="#1a2332" font-family="sans-serif" font-size="12">진행 가능한 사람 2명 이상</text>
  </g>

  <g>
    <rect x="446" y="100" width="192" height="196" rx="14" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="542" cy="140" r="21" fill="#568a35"/>
    <text x="542" y="148" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="17" font-weight="800">3</text>
    <text x="542" y="184" text-anchor="middle" fill="#1a2332" font-family="sans-serif" font-size="15" font-weight="800">결석 규칙</text>
    <text x="542" y="206" text-anchor="middle" fill="#5b6b82" font-family="sans-serif" font-size="11.5">이유를 묻는 순간 결석은 죄가 된다</text>
    <line x1="478" y1="224" x2="606" y2="224" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="542" y="248" text-anchor="middle" fill="#568a35" font-family="sans-serif" font-size="11.5" font-weight="700">한 줄 통보 · 5줄 요약 공유</text>
    <text x="542" y="270" text-anchor="middle" fill="#1a2332" font-family="sans-serif" font-size="12">두 번 연속일 때만 연락</text>
  </g>

  <g>
    <rect x="652" y="100" width="192" height="196" rx="14" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="748" cy="140" r="21" fill="#c07a3e"/>
    <text x="748" y="148" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="17" font-weight="800">4</text>
    <text x="748" y="184" text-anchor="middle" fill="#1a2332" font-family="sans-serif" font-size="15" font-weight="800">4명으로 시작</text>
    <text x="748" y="206" text-anchor="middle" fill="#5b6b82" font-family="sans-serif" font-size="11.5">12명으로 열면 3주 뒤 3명</text>
    <line x1="684" y1="224" x2="812" y2="224" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="748" y="248" text-anchor="middle" fill="#568a35" font-family="sans-serif" font-size="11.5" font-weight="700">추천으로만 +4명 확장</text>
    <text x="748" y="270" text-anchor="middle" fill="#1a2332" font-family="sans-serif" font-size="12">4명으로 열면 4명이 남는다</text>
  </g>

  <text x="440" y="340" text-anchor="middle" fill="#1a2332" font-family="sans-serif" font-size="14" font-weight="700">0주 뼈대 · 1주 4명 · 2주 역할 · 3주 결석규칙 · 4~5주 확장 · 6주 점검</text>
  <text x="440" y="368" text-anchor="middle" fill="#8a97a8" font-family="sans-serif" font-size="13" font-weight="600">모임이 없어도 구조는 혼자 만든다 — 요일 고정 · 3줄 보고 · 하루 1쪽</text>
</svg>
