<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-label="절제의 성공학: 마시멜로 실험과 자아고갈 이론, 옛 통념과 최신 연구의 차이">
  <rect width="880" height="400" rx="20" fill="#f5f8fb"/>
  <text x="440" y="46" text-anchor="middle" fill="#1a2332" font-family="sans-serif" font-size="22" font-weight="800">절제는 의지력이 아니었다</text>
  <text x="440" y="74" text-anchor="middle" fill="#105d9e" font-family="sans-serif" font-size="14" font-weight="700">마시멜로 실험과 자아고갈 이론이 뒤집힌 자리</text>
  <g>
    <rect x="70" y="104" width="330" height="220" rx="14" fill="#ffffff" stroke="#9aa5b6" stroke-width="2"/>
    <text x="235" y="140" text-anchor="middle" font-family="sans-serif" font-size="24">🍬</text>
    <text x="235" y="170" text-anchor="middle" fill="#1a2332" font-family="sans-serif" font-size="16" font-weight="800">옛 통념</text>
    <text x="235" y="198" text-anchor="middle" fill="#5b6b82" font-family="sans-serif" font-size="12">참을성 = 타고난 성격</text>
    <text x="235" y="222" text-anchor="middle" fill="#5b6b82" font-family="sans-serif" font-size="12">의지력 = 쓸수록 닳는 근육</text>
    <text x="235" y="246" text-anchor="middle" fill="#5b6b82" font-family="sans-serif" font-size="12">실패 = 의지가 약해서</text>
    <text x="235" y="288" text-anchor="middle" fill="#1a2332" font-family="sans-serif" font-size="13" font-weight="700">"더 독해져야 한다"</text>
  </g>
  <g>
    <rect x="480" y="104" width="330" height="220" rx="14" fill="#ffffff" stroke="#568a35" stroke-width="2"/>
    <text x="645" y="140" text-anchor="middle" font-family="sans-serif" font-size="24">🌱</text>
    <text x="645" y="170" text-anchor="middle" fill="#1a2332" font-family="sans-serif" font-size="16" font-weight="800">최신 연구</text>
    <text x="645" y="198" text-anchor="middle" fill="#5b6b82" font-family="sans-serif" font-size="12">참을성 = 환경 신뢰의 문제</text>
    <text x="645" y="222" text-anchor="middle" fill="#5b6b82" font-family="sans-serif" font-size="12">고갈 효과, 24개 연구실서 재현 안 됨</text>
    <text x="645" y="246" text-anchor="middle" fill="#5b6b82" font-family="sans-serif" font-size="12">실패 = 설계가 부족해서</text>
    <text x="645" y="288" text-anchor="middle" fill="#568a35" font-family="sans-serif" font-size="13" font-weight="700">"참을 필요를 줄이면 된다"</text>
  </g>
  <text x="440" y="352" text-anchor="middle" fill="#1a2332" font-family="sans-serif" font-size="13.5" font-weight="700">마시멜로 실험(1972·2018 재현) · 자아고갈 이론(1998·2016 재현)</text>
  <text x="440" y="378" text-anchor="middle" fill="#568a35" font-family="sans-serif" font-size="12" font-weight="700">🌱 비전을 심으면, 반드시 열매가 열립니다</text>
</svg>
