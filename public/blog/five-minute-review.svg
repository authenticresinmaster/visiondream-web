<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-label="하루 5분 회고 3줄: 잘한 것 하나, 아쉬운 것 하나, 내일 할 것 하나 — 반성이 아니라 오늘 닫기">
  <rect width="880" height="400" rx="20" fill="#f5f8fb"/>
  <text x="440" y="46" text-anchor="middle" fill="#1a2332" font-family="sans-serif" font-size="22" font-weight="800">하루 5분 회고 — 3줄이면 끝</text>
  <text x="440" y="74" text-anchor="middle" fill="#105d9e" font-family="sans-serif" font-size="14" font-weight="700">반성하는 시간이 아니라, 오늘을 닫는 시간</text>
  <g>
    <rect x="60" y="110" width="240" height="150" rx="14" fill="#ffffff" stroke="#568a35" stroke-width="2"/>
    <text x="180" y="150" text-anchor="middle" font-family="sans-serif" font-size="26">✅</text>
    <text x="180" y="192" text-anchor="middle" fill="#1a2332" font-family="sans-serif" font-size="15" font-weight="800">잘한 것 하나</text>
    <text x="180" y="216" text-anchor="middle" fill="#5b6b82" font-family="sans-serif" font-size="11.5">유지할 조건을 남긴다</text>
  </g>
  <g>
    <rect x="320" y="110" width="240" height="150" rx="14" fill="#ffffff" stroke="#105d9e" stroke-width="2"/>
    <text x="440" y="150" text-anchor="middle" font-family="sans-serif" font-size="26">🔧</text>
    <text x="440" y="192" text-anchor="middle" fill="#1a2332" font-family="sans-serif" font-size="15" font-weight="800">아쉬운 것 하나</text>
    <text x="440" y="216" text-anchor="middle" fill="#5b6b82" font-family="sans-serif" font-size="11.5">자책 말고 조건 한 개만</text>
  </g>
  <g>
    <rect x="580" y="110" width="240" height="150" rx="14" fill="#ffffff" stroke="#1a2332" stroke-width="2"/>
    <text x="700" y="150" text-anchor="middle" font-family="sans-serif" font-size="26">➡️</text>
    <text x="700" y="192" text-anchor="middle" fill="#1a2332" font-family="sans-serif" font-size="15" font-weight="800">내일 할 것 하나</text>
    <text x="700" y="216" text-anchor="middle" fill="#5b6b82" font-family="sans-serif" font-size="11.5">내일 아침의 첫 물리행동</text>
  </g>
  <text x="440" y="312" text-anchor="middle" fill="#1a2332" font-family="sans-serif" font-size="13.5" font-weight="700">못 끝낸 일은 사라지지 않는다 — 내일로 넘길 뿐</text>
  <text x="440" y="342" text-anchor="middle" fill="#5b6b82" font-family="sans-serif" font-size="12">하루 걸러도 이틀 연속만 아니면 습관은 살아 있다</text>
  <text x="440" y="374" text-anchor="middle" fill="#568a35" font-family="sans-serif" font-size="12" font-weight="700">🌱 비전을 심으면, 반드시 열매가 열립니다</text>
</svg>
